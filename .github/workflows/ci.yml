name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: tests/Arbor.Build.Tests.Unit

    - name: Restore
      run: dotnet restore --configfile .github/nuget.config

    - name: Build (compile check)
      run: dotnet build --no-restore --configuration Debug

    - name: Run unit tests
      run: dotnet test tests/Arbor.Build.Tests.Unit --no-build --configuration Debug --logger "console;verbosity=normal"

    - name: Validate comparison script with mock packages
      shell: pwsh
      run: |
        $tmp = [System.IO.Path]::GetTempPath()
        $testDir = Join-Path $tmp "compare-test-$(New-Guid)"
        New-Item -ItemType Directory -Path $testDir | Out-Null

        # Create two minimal .nupkg (zip) files with identical content
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        foreach ($name in @('win.nupkg', 'linux.nupkg')) {
            $zip = [System.IO.Compression.ZipFile]::Open(
                (Join-Path $testDir $name),
                [System.IO.Compression.ZipArchiveMode]::Create)
            try {
                $entry = $zip.CreateEntry('lib/Arbor.Build.Tool.dll')
                $writer = [System.IO.StreamWriter]::new($entry.Open())
                try { $writer.Write('mock content') } finally { $writer.Dispose() }
            } finally { $zip.Dispose() }
        }

        $report = Join-Path $testDir 'report.md'
        pwsh -NonInteractive -File ./.github/scripts/Compare-ArborBuildToolPackages.ps1 `
            -WindowsPackagePath (Join-Path $testDir 'win.nupkg') `
            -LinuxPackagePath   (Join-Path $testDir 'linux.nupkg') `
            -ReportPath $report

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Comparison script failed with exit code $LASTEXITCODE"
            exit 1
        }

        if (-not (Test-Path $report)) {
            Write-Error "Comparison script did not produce a report"
            exit 1
        }

        Write-Host "Comparison script validation passed"
        Remove-Item -Recurse -Force $testDir

  build-windows:
    needs: validate
    runs-on: windows-2025-vs2026

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: tests/Arbor.Build.Tests.Integration

    - name: Verify .NET installation
      shell: pwsh
      run: |
        dotnet --version
        dotnet --list-runtimes
        dotnet --list-sdks

    - name: Install global tools
      shell: pwsh
      run: |
        dotnet tool install --global Arbor.Tooler.GlobalTool --version "*-*" --configfile .github/nuget.config
        dotnet tool install --global Arbor.Build.Bootstrapper --version "*-*" --configfile .github/nuget.config

    - name: Build with Arbor.Build
      shell: cmd
      env:
        Arbor.Build.NuGet.PackageUpload.Server.ApiKey: ${{ secrets.myget }}
        Arbor.Build.NuGet.PackageUpload.Server.Uri: "https://www.myget.org/F/arbor/api/v2/package"
        Arbor.Build.NuGet.PackageUpload.Enabled: "true"
        Arbor.Build.NuGet.PackageUpload.ForceUploadEnabled: "true"
        Arbor.Build.Tools.External.MSBuild.DeterministicBuild.Enabled: "true"
        Arbor.Build.BuildNumber.UnixEpochSecondsEnabled: "false"
      run: |
        call build\build.bat

    - name: Run all tests (including cross-platform validation)
      shell: pwsh
      run: |
        dotnet test --logger "console;verbosity=detailed" --no-build

    - name: Upload build artifacts (Windows)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-windows
        path: artifacts/
        retention-days: 7

  build-linux:
    needs:
    - build-windows
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: artifacts-windows
        path: artifacts-windows

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: tests/Arbor.Build.Tests.Integration

    - name: Verify .NET installation
      shell: bash
      run: |
        dotnet --version
        dotnet --list-runtimes
        dotnet --list-sdks

    - name: Install global tools
      shell: bash
      run: |
        dotnet tool install --global Arbor.Tooler.GlobalTool --version "*-*" --configfile .github/nuget.config
        WINDOWS_TOOL_PACKAGE=$(find artifacts-windows -type f -name 'Arbor.Build.Tool.*.nupkg' | sort | tail -n 1)
        if [ -z "${WINDOWS_TOOL_PACKAGE}" ]; then
          echo "No Windows Arbor.Build.Tool package found in downloaded artifacts"
          exit 1
        fi
        WINDOWS_TOOL_VERSION=$(basename "${WINDOWS_TOOL_PACKAGE}" | sed -E 's/^Arbor\.Build\.Tool\.(.+)\.nupkg$/\1/')
        echo "ARBOR_BUILD_TOOL_VERSION=${WINDOWS_TOOL_VERSION}" >> "${GITHUB_ENV}"
        dotnet tool install --global Arbor.Build.Tool --version "${WINDOWS_TOOL_VERSION}" --add-source "$(dirname "${WINDOWS_TOOL_PACKAGE}")" --ignore-failed-sources

    - name: Build with Arbor.Build
      shell: bash
      env:
        Arbor.Build.Version: "${{ env.ARBOR_BUILD_TOOL_VERSION }}"
        Arbor.Build.Tools.External.MSBuild.DotNet.Enabled: "true"
        Arbor.Build.Tools.External.MSBuild.DeterministicBuild.Enabled: "true"
        Arbor.Build.BuildNumber.UnixEpochSecondsEnabled: "false"
        Arbor.Build.Vcs.Branch.Name: "${{ github.ref }}"
      run: |
        arbor-build

    - name: Run cross-platform tests
      shell: bash
      run: |
        dotnet test --filter "FullyQualifiedName~CrossPlatform" --logger "console;verbosity=detailed" --no-build

    - name: Normalize artifacts directory (Linux is case-sensitive)
      if: always()
      shell: bash
      run: |
        if [ -d Artifacts ] && [ ! -d artifacts ]; then
          mv Artifacts artifacts
        fi

    - name: Upload build artifacts (Linux)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-linux
        path: artifacts/
        retention-days: 7

  compare-packages:
    needs:
    - build-windows
    - build-linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: artifacts-windows
        path: artifacts-windows

    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: artifacts-linux
        path: artifacts-linux

    - name: Compare Arbor.Build.Tool packages (Windows vs Linux)
      shell: pwsh
      run: |
        $windowsPackage = Get-ChildItem -Path 'artifacts-windows' -Filter 'Arbor.Build.Tool.*.nupkg' -File -Recurse | Sort-Object FullName | Select-Object -Last 1
        $linuxPackage = Get-ChildItem -Path 'artifacts-linux' -Filter 'Arbor.Build.Tool.*.nupkg' -File -Recurse | Sort-Object FullName | Select-Object -Last 1
        $reportPath = 'artifacts/package-comparison/arbor-build-tool-package-comparison.md'

        $windowsPath = $windowsPackage?.FullName
        $linuxPath = $linuxPackage?.FullName

        ./.github/scripts/Compare-ArborBuildToolPackages.ps1 -WindowsPackagePath $windowsPath -LinuxPackagePath $linuxPath -ReportPath $reportPath

    - name: Upload comparison report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: package-comparison
        path: artifacts/package-comparison/
        retention-days: 7
